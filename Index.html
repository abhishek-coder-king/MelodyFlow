
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="MelodyFlow - Your music space">
  <title>MelodyFlow - Music</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>Melody<span>Flow</span></h1>
    <button id="profileBtn" aria-label="Profile">●</button>
  </header>

  <main>
    <section class="welcome">
      <h2>Good music, good mood.</h2>
      <p>Your music space. Anytime.</p>
    </section>

    <section class="section">
      <h2>Made for you</h2>
      <div class="music-grid" id="musicGrid">
        <p>Loading music...</p>
      </div>
    </section>

    <section class="section">
      <h2>Your Library</h2>
      <p id="libraryMessage">Your favourite music will appear here.</p>
    </section>
  </main>

  <section class="player" id="player">
    <div>
      <strong id="songTitle">Select a song</strong>
      <p id="artistName">MelodyFlow</p>
    </div>
    <button id="playBtn" aria-label="Play or pause">▶</button>
  </section>

  <nav class="bottom-nav">
    <button>⌂ <span>Home</span></button>
    <button>⌕ <span>Search</span></button>
    <button>♫ <span>Library</span></button>
  </nav>

  <audio id="audioPlayer"></audio>

  <script src="script.js"></script>
</body>
</html>
